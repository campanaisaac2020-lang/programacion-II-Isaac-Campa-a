<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista libros</title>
</head>
<body>
    <h1>Lista de libros</h1>
    {% if messages %}
       <ul>
        {% for mensaje in messages %}
            <li>{{ mensaje }}</li>
        {% endfor %}
       </ul>
    {% endif %}
    <button>
        <a href="{% url 'create_libro' %}">
            Crear libro</a>
    </button>
    <table>
        <thead>
            <tr>
                <th>Título</th>
                <th>Autor</th>
                <th>Fecha de Publicación</th>
            </tr>
        </thead>
        <tbody>
            {% for libro in libros %}
                <tr>
                    <td>{{ libro.titulo }}</td>
                    <td>{{ libro.autor }}</td>
                    <td>{{ libro.fecha_publicacion }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3">No hay libros disponibles.</td>
                </tr>
            {% endfor %}
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">
            </tr>
        </tfoot>
    </table>
</body>
</html>
