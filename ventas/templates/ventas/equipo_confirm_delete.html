<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar eliminación</title>
</head>
<body>
    <center>
        <h1>Venta de equipos móviles</h1>
        <h2>Confirmar eliminación</h2>
    </center>

    <hr>

    <fieldset>
        <legend>Confirmación</legend>
        <p>¿Seguro que quieres eliminar <strong>{{ equipo }}</strong>?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit">Sí, eliminar</button>
            <a href="{% url 'equipo_list' %}"><button type="button">Cancelar</button></a>
        </form>
    </fieldset>
</body>
</html>
