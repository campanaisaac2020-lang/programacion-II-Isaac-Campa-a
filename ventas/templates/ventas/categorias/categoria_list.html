{% extends 'ventas/base.html' %}{% block content %}<h1>Categorías</h1><p><a href="{% url 'categoria_create' %}">Crear categoría</a></p><ul>{% for categoria in categorias %}<li><a href="{% url 'categoria_detail' categoria.pk %}">{{ categoria }}</a> — <a href="{% url 'categoria_update' categoria.pk %}">Editar</a> — <a href="{% url 'categoria_delete' categoria.pk %}">Eliminar</a></li>{% empty %}<li>No hay categorías.</li>{% endfor %}</ul>{% endblock %}
