<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if form.instance.pk %}Editar equipo{% else %}Añadir equipo{% endif %}</title>
</head>
<body>
    <center>
        <h1>Venta de equipos móviles</h1>
        <h2>{% if form.instance.pk %}Editar equipo{% else %}Registrar equipo{% endif %}</h2>
    </center>

    <hr>

    <fieldset>
        <legend>Datos del equipo</legend>
        <form method="POST">
            {% csrf_token %}
            <table cellpadding="8" align="center">
                {{ form.as_table }}
                <tr>
                    <td colspan="2" align="center">
                        <button type="submit">Guardar equipo</button>
                        <button type="button"><a href="{% url 'equipo_list' %}">Cancelar</a></button>
                    </td>
                </tr>
            </table>
        </form>
    </fieldset>
</body>
</html>
